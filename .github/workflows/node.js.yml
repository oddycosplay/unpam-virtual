# Instal dependensi, cek tipe, jalankan tes server, dan build client di setiap push/PR ke main.
# Versi Node minimum 22.12: dibutuhkan vitest 5, better-sqlite3 13, unpdf, dan concurrently.
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run typecheck
    - run: npm test
    - run: npm run build -w client
